<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" role="img" aria-label="MAVPOS receipt header">
<title>MAVPOS</title>
<defs>
  <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
    <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.22"/>
  </filter>
</defs>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .paper { fill: #fbf8f1; }
  .title { font-size: 36px; font-weight: 700; fill: #2b2a27; letter-spacing: 2px; }
  .tag { font-size: 14px; fill: #2b2a27; }
  .lbl { font-size: 12px; fill: #b45309; letter-spacing: 1.5px; }
  .val { font-size: 15px; fill: #2b2a27; }
  .link { font-size: 15px; fill: #0f766e; }
  .small { font-size: 11px; fill: #8a8478; letter-spacing: 3px; }
  .dash { stroke: #8a8478; stroke-width: 1.4; stroke-dasharray: 5 5; opacity: .8; }
  .bar { fill: #2b2a27; transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow .35s ease-out forwards; }
  .in { opacity: 0; animation: fadeUp .5s ease-out forwards; }
  .sheet { animation: feed 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .cart path, .cart circle { fill: none; stroke: #d97706; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cart { opacity: 0; animation: fadeUp .6s ease-out .45s forwards; }
  .laser { fill: #c0392b; opacity: 0; animation: scan 3.6s ease-in-out 4.2s infinite; }
  .stamp { opacity: 0; transform-box: fill-box; transform-origin: center; animation: stamp .45s cubic-bezier(.3,1.6,.5,1) 3.6s forwards; }
  .cursor { fill: #2b2a27; animation: blink 1s steps(1) 2.6s infinite; opacity: 0; }
  @keyframes feed { from { transform: translateY(-36px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  @keyframes grow { to { transform: scaleY(1); } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes scan { 0% { opacity: 0; transform: translateX(0); } 8% { opacity: .85; } 50% { opacity: .85; transform: translateX(410px); } 58% { opacity: 0; transform: translateX(410px); } 100% { opacity: 0; transform: translateX(0); } }
  @keyframes stamp { 0% { opacity: 0; transform: scale(2.4) rotate(-14deg); } 100% { opacity: .92; transform: scale(1) rotate(-14deg); } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important; }
}
</style>

