<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-label="Cảm ơn đã sử dụng MAVPOS">
<title>Cảm ơn đã sử dụng MAVPOS</title>
<defs>
  <filter id="shadow" x="-10%" y="-5%" width="120%" height="125%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
  </filter>
</defs>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .thanks { font-size: 20px; font-weight: 700; fill: #2b2a27; letter-spacing: 3px; }
  .mail { font-size: 13px; fill: #8a8478; }
  .bar { fill: #2b2a27; transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow .35s ease-out forwards; }
  .in { opacity: 0; animation: fadeUp .6s ease-out forwards; }
  .laser { fill: #c0392b; opacity: 0; animation: scan 3.2s ease-in-out 2s infinite; }
  .heart { fill: #c0392b; transform-box: fill-box; transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes grow { to { transform: scaleY(1); } }
  @keyframes scan { 0% { opacity: 0; transform: translateX(0); } 8% { opacity: .85; } 50% { opacity: .85; transform: translateX(340px); } 58% { opacity: 0; transform: translateX(340px); } 100% { opacity: 0; transform: translateX(0); } }
  @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important; }
}
</style>
