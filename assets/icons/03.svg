<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" role="img" aria-label="icon 03">
<style>
  .frame { fill: #3b5b8c; fill-opacity: .1; stroke: #3b5b8c; stroke-width: 1.4; opacity: .7; }
  .g { fill: none; stroke: #3b5b8c; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.1s ease-out forwards; }
  .pulse { fill: #3b5b8c; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ping 3s ease-out 1.4s infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes ping { 0% { opacity: .35; transform: scale(.4); } 70%,100% { opacity: 0; transform: scale(1.6); } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important; }
}
</style>
